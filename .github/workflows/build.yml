
name: Build THE HEARTCRUSHER

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build plugin
        run: mvn -B package
        working-directory: THE-HEARTCRUSHER-source/Heartcrusher

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: THE-HEARTCRUSHER
          path: THE-HEARTCRUSHER-source/Heartcrusher/target/*.jar

